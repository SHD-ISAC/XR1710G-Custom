name: XR1710G firmware

on:
  push:
    branches: [xr1710g-custom]
    paths-ignore: ['docs/**']
  pull_request:
    branches: [xr1710g-custom, xr1710g-6.18-integration]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xr1710g-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gettext \
            git libncurses-dev libssl-dev zlib1g-dev python3 python3-dev \
            python3-setuptools pkgconf cmake ninja-build cpio \
            device-tree-compiler xsltproc libelf-dev file wget curl rsync \
            unzip swig time zstd qemu-user
          df -h .

      - name: Install pinned feeds and select XR1710G
        run: |
          cp configs/xr1710g-feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp configs/xr1710g.config .config
          make defconfig
          grep -qx 'CONFIG_TARGET_airoha_an7581_DEVICE_gemtek_xr1710g-ubi=y' .config
          grep -qx 'CONFIG_IPV6=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-airoha-npu=y' .config
          grep -qx 'CONFIG_PACKAGE_luci-app-w1700k-fancontrol=y' .config
          grep -qx 'CONFIG_PACKAGE_dnsmasq-full=y' .config
          grep -qx 'CONFIG_PACKAGE_dnsmasq_full_dnssec=y' .config
          if grep -qx 'CONFIG_PACKAGE_dnsmasq=y' .config; then
            echo 'Plain dnsmasq would break retained DNSSEC settings' >&2
            exit 1
          fi
          ./scripts/diffconfig.sh > build.config

      - name: Restore build tools
        id: build-tools-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            dl
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
          key: ${{ runner.os }}-xr1710g-tools-v1-${{ hashFiles('tools/**', 'toolchain/**', 'include/**', 'configs/**') }}

      - name: Download sources
        run: |
          set -o pipefail
          make download -j8 V=s 2>&1 | tee download.log

      - name: Check mt76 patch application and teardown regressions
        run: |
          set -o pipefail
          bash scripts/tests/check-xr1710g-mt76.sh 2>&1 | tee mt76-patch-check.log

      - name: Build firmware from source
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: Validate image outputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          out = Path('bin/targets/airoha/an7581')
          profiles = json.loads((out / 'profiles.json').read_text())
          device = profiles['profiles']['gemtek_xr1710g-ubi']
          images = device['images']
          assert any(x['type'] == 'sysupgrade' for x in images), images
          for image in images:
              assert (out / image['name']).stat().st_size > 0
          print('XR1710G image metadata and files verified')
          PY
          cd bin/targets/airoha/an7581
          sha256sum -c sha256sums

      - name: Check built DNS and DHCP configuration compatibility
        run: |
          set -o pipefail
          roots=(build_dir/target-*/root-airoha)
          test "${#roots[@]}" -eq 1 && test -d "${roots[0]}"
          python3 scripts/tests/xr1710g-dnsmasq-regression.py "${roots[0]}" \
            2>&1 | tee dnsmasq-regression.log

      - name: Cache build tools
        if: always() && !cancelled() && steps.build-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            dl
            build_dir/host
            build_dir/hostpkg
            build_dir/toolchain-*
            staging_dir/host
            staging_dir/hostpkg
            staging_dir/toolchain-*
          key: ${{ runner.os }}-xr1710g-tools-v1-${{ hashFiles('tools/**', 'toolchain/**', 'include/**', 'configs/**') }}

      - name: Save build logs and configuration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xr1710g-build-logs-${{ github.run_id }}
          path: |
            build.log
            download.log
            build.config
            mt76-patch-check.log
            dnsmasq-regression.log
            logs/
          retention-days: 14

      - name: Save firmware
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xr1710g-firmware-${{ github.sha }}
          path: bin/targets/airoha/an7581/
          if-no-files-found: error
          retention-days: 14
